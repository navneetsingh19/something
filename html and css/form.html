<body>

<div class="form-box">

  <h1>Employee Onboarding</h1>
  <p class="subtitle">Add a new employee to your organization</p>

  <form>

    <div class="section">Personal Information</div>

    <div class="grid">

      <div class="field">
        <label>First Name          
        </label>
        <input type="text" placeholder="Enter first name" required>
      </div>

      <div class="field">
        <label>Last Name</label>
        <input type="text" placeholder="Enter last name">
      </div>

      <div class="field">
        <label>Email Address</label>
        <input type="email" placeholder="name@company.com">
      </div>

      <div class="field">
        <label>Phone Number</label>
        <input type="tel" placeholder="+91 98765 43210">
      </div>

    </div>

    <div class="section">Job Information</div>

    <div class="grid">

      <div class="field">
        <label>Department</label>
        <select>
          <option>Select department</option>
          <option>Engineering</option>
          <option>Data</option>
          <option>Marketing</option>
          <option>Finance</option>
        </select>
      </div>

      <div class="field">
        <label>Job Role</label>
        <input type="text" placeholder="e.g. Python Developer">
      </div>

      <div class="field">
        <label>Joining Date</label>
        <input type="date">
      </div>

      <div class="field">
        <label>Employment Type</label>
        <select>
          <option>Select type</option>
          <option>Full-time</option>
          <option>Part-time</option>
          <option>Intern</option>
        </select>
      </div>

      <div class="field full">
        <label>Additional Notes</label>
        <textarea placeholder="Add any relevant information..."></textarea>
      </div>

    </div>

    <div class="actions">
      <button type="button" class="cancel">Cancel</button>
      <button type="submit" class="submit">Create Employee</button>
    </div>

  </form>
</div>

</body>
</html>
